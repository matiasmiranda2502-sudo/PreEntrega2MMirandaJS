<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito</title>
  <link rel="stylesheet" href="../Estilos/styles.css">
  <script defer src="../js/carrito.js"></script>
</head>
<body>
  <h1>Carrito de Compras</h1>

  <h2><a href="../index.html">Volver a Productos</a></h2>

  <!-- Layout -->
  <div class="carrito-layout">
    <section id="contenedor-carrito" class="carrito-productos"></section>

    <aside class="carrito-resumen">
      <div class="acciones-carrito">
        <button id="boton-vaciar">Vaciar carrito</button>
        <select id="select-cuotas">
          <option value="">Seleccionar cuotas para pagar</option>
        </select>
        <div id="detalle-cuotas"></div>
        <button id="boton-confirmar" style="display: none;">Confirmar compra</button>
      </div>
    </aside>
  </div>

  <footer>PreEntrega 2 Matias Miranda JS</footer>

</body>
</html>
